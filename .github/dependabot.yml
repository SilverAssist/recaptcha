# Dependabot configuration for automated dependency updates
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group all minor and patch updates together
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # TypeScript is pinned to 6.x: ts-jest peer-requires `>=4.3 <7` and no
    # published ts-jest supports TypeScript 7 yet (latest is 29.4.12). Bumping
    # to 7.0.2 broke `npm ci` outright and went unnoticed until a release was
    # attempted. Remove this ignore once ts-jest declares TypeScript 7 support.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Separate major updates for careful review
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
  
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
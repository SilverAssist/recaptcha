name: CI

permissions:
  contents: read

on:
  # This repo's default branch is `main`; these were pointing at `master`, so CI
  # had never run once -- not on a push, not on a PR. That is how a Dependabot
  # bump that breaks `npm ci` outright reached the default branch (see #55).
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    # publish.yml releases on Node 24; the matrix keeps Node 20 covered too,
    # matching the other @silverassist packages.
    name: Code Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '24.x']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run lint
      
      - name: Build package
        run: npm run build
      
      - name: Run tests
        run: npm test
      
      - name: Create summary
        if: success()
        run: |
          echo "## ✅ All Quality Checks Passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checking (TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
name: CI

permissions:
  contents: read

on:
  # This repo's default branch is `main`; these were pointing at `master`, so CI
  # had never run once -- not on a push, not on a PR. That is how a Dependabot
  # bump that breaks `npm ci` outright reached the default branch (see #55).
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    # tsdown requires Node ^22.18.0 || >=24.11.0, so the build cannot run on
    # Node 20 at all. That is a *build* constraint -- consumers run the compiled
    # dist/, not tsdown. `engines` declares >=22.0.0 to match exactly what this
    # matrix verifies -- every consuming Next.js repo already pins Node 22, and
    # Node 20 lost security support on 2026-04-30.
    name: Code Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run lint
      
      - name: Build package
        run: npm run build
      
      - name: Run tests
        run: npm test
      
      - name: Create summary
        if: success()
        run: |
          echo "## ✅ All Quality Checks Passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checking (TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY

  integration:
    # Consumes the *packed tarball* from a real Next.js app, which is the only
    # way three defects found in this org were visible: a missing "use client"
    # directive (fails only when a Server Component imports the built file), an
    # `exports` map pointing at files the build never produced, and a token that
    # never reached the hidden input a Server Action reads (osa-nextjs WEB-901,
    # then a hotfix disabling reCAPTCHA outright). No unit test can see any of
    # them.
    name: Next.js integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build fixture against the packed tarball
        run: npm run e2e:setup

      - name: Run integration specs
        run: npx playwright test -c e2e/playwright.config.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: e2e/test-results/
          retention-days: 7

